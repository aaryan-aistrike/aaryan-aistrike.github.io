<script>
  // beacon scope animation (homepage hero)
  (function () {
    var canvas = document.getElementById('scopeCanvas');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);

    function resize() {
      var rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      canvas.style.width = rect.width + 'px';
      canvas.style.height = rect.height + 'px';
    }
    resize();
    window.addEventListener('resize', resize);

    function getColor(varName) {
      return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
    }

    function hexToRgb(c) {
      // supports rgba(...) passthrough or #hex
      if (c.indexOf('rgb') === 0) {
        var m = c.match(/[\d.]+/g);
        return { r: +m[0], g: +m[1], b: +m[2] };
      }
      var h = c.replace('#', '');
      if (h.length === 3) h = h.split('').map(function (x) { return x + x; }).join('');
      var n = parseInt(h, 16);
      return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
    }

    // each beacon fires on its own period, with a fast attack / slow decay envelope
    var GOLDEN = 0.6180339887498949; // golden ratio conjugate (1/phi)
    var beacons = [];
    for (var i = 0; i < 5; i++) {
      // golden-ratio low-discrepancy placement: non-uniform but well-spread, not evenly spaced
      var frac = ((i + 1) * GOLDEN) % 1;
      var pos = 0.08 + frac * 0.84;
      // each beacon's rhythm scaled by a power of phi, so intervals compound
      // the golden ratio rather than incrementing linearly
      var period = 130 * Math.pow(1 / GOLDEN, i * 0.5);
      beacons.push({
        pos: pos + (Math.random() * 0.015 - 0.0075),
        period: period + Math.random() * 15,
        offset: Math.random() * 300,
        packet: null
      });
    }

    var noiseSeed = Math.random() * 1000;
    var t = 0;

    function draw() {
      var w = canvas.width, h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      var baseline = h * 0.64;
      var gridColor = getColor('--grid-line') || getColor('--border');
      var lineColor = getColor('--border-strong');
      var accentRaw = getColor('--scan-line');
      var accentTextRaw = getColor('--accent-text');
      var rgb = hexToRgb(accentTextRaw || accentRaw);
      var accentSolid = 'rgb(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ')';
      var greenRaw = getColor('--term-green');
      var greenRgb = hexToRgb(greenRaw);
      var greenSolid = 'rgb(' + greenRgb.r + ',' + greenRgb.g + ',' + greenRgb.b + ')';
      var hotSolid = 'rgb(255, 76, 40)'; // hot orange-red for spike tips and ping rings

      // faint horizontal graticule
      ctx.strokeStyle = gridColor;
      ctx.lineWidth = 1;
      for (var gy = 0.18; gy < 1; gy += 0.22) {
        ctx.beginPath();
        ctx.moveTo(0, h * gy);
        ctx.lineTo(w, h * gy);
        ctx.stroke();
      }

      // baseline with a subtle noise floor, not a dead-flat line
      ctx.strokeStyle = lineColor;
      ctx.lineWidth = 1 * dpr;
      ctx.beginPath();
      for (var x = 0; x <= w; x += 6 * dpr) {
        var n = Math.sin((x + noiseSeed * 40) * 0.04) * 1.2 + Math.sin((x + noiseSeed * 90) * 0.11) * 0.6;
        var y = baseline + n * dpr;
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();

      beacons.forEach(function (b) {
        var x = b.pos * w;
        var phase = ((t + b.offset) % b.period) / b.period; // 0..1 per cycle
        // fast attack, slower exponential-ish decay envelope
        var env;
        if (phase < 0.06) {
          env = phase / 0.06;
        } else {
          env = Math.pow(1 - (phase - 0.06) / (1 - 0.06), 1.6);
        }
        var restH = h * 0.05;
        var spikeH = restH + (h * 0.4 - restH) * env;
        var glow = 6 + 14 * env;

        // spike line with glow
        ctx.save();
        ctx.shadowColor = accentSolid;
        ctx.shadowBlur = glow;
        ctx.strokeStyle = accentSolid;
        ctx.lineWidth = (1.4 + 1.2 * env) * dpr;
        ctx.beginPath();
        ctx.moveTo(x, baseline);
        ctx.lineTo(x, baseline - spikeH);
        ctx.stroke();
        ctx.restore();

        // apex dot - hot orange-red tip
        ctx.save();
        ctx.shadowColor = hotSolid;
        ctx.shadowBlur = glow;
        ctx.beginPath();
        ctx.arc(x, baseline - spikeH, (1.6 + 1.4 * env) * dpr, 0, Math.PI * 2);
        ctx.fillStyle = hotSolid;
        ctx.fill();
        ctx.restore();

        // expanding "ping" ring right at the fire moment - same hot orange-red
        if (phase < 0.35) {
          var ringT = phase / 0.35;
          var ringR = (4 + ringT * 26) * dpr;
          ctx.save();
          ctx.globalAlpha = (1 - ringT) * 0.5;
          ctx.strokeStyle = hotSolid;
          ctx.lineWidth = 1.2 * dpr;
          ctx.beginPath();
          ctx.arc(x, baseline - spikeH, ringR, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        // launch a packet toward the destination when the beacon fires
        if (phase < 0.03 && (!b.packet || b.packet.done)) {
          b.packet = { start: x, progress: 0, done: false };
        }
        if (b.packet && !b.packet.done) {
          b.packet.progress += 0.012;
          if (b.packet.progress >= 1) {
            b.packet.done = true;
          } else {
            var px = b.packet.start + (w - b.packet.start) * b.packet.progress;
            var py = baseline - (1 - b.packet.progress) * 4 * dpr;
            var packetAlpha = Math.sin(Math.PI * b.packet.progress);
            ctx.save();
            ctx.globalAlpha = packetAlpha;
            ctx.shadowColor = greenSolid;
            ctx.shadowBlur = 8;
            ctx.fillStyle = greenSolid;
            ctx.beginPath();
            ctx.arc(px, py, 1.8 * dpr, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        }
      });

      // soft glowing sweep band
      if (!reduceMotion) {
        var sweepX = ((t * 1.3) % (w + 240)) - 120;
        var grad = ctx.createLinearGradient(sweepX - 90, 0, sweepX + 90, 0);
        grad.addColorStop(0, 'transparent');
        grad.addColorStop(0.5, accentRaw);
        grad.addColorStop(1, 'transparent');
        ctx.globalAlpha = 0.22;
        ctx.fillStyle = grad;
        ctx.fillRect(sweepX - 90, 0, 180, h);
        ctx.globalAlpha = 1;
      }

      t += 1;
      if (!reduceMotion) requestAnimationFrame(draw);
    }
    draw();
  })();
</script>
