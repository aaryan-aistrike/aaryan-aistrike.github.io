<script>
  // theme toggle: cycles system -> light -> dark -> system
  (function () {
    var root = document.documentElement;
    var btn = document.getElementById('themeToggle');
    if (!btn) return;
    var sunIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
    var moonIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.6A9 9 0 1 1 11.4 3a7 7 0 0 0 9.6 9.6z"/></svg>';
    var autoIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor" stroke="none"/></svg>';

    function apply(mode) {
      if (mode === 'system') { root.removeAttribute('data-theme'); btn.innerHTML = autoIcon; }
      else { root.setAttribute('data-theme', mode); btn.innerHTML = mode === 'dark' ? moonIcon : sunIcon; }
      try { localStorage.setItem('theme-pref', mode); } catch (e) {}
    }
    var saved = 'system';
    try { saved = localStorage.getItem('theme-pref') || 'system'; } catch (e) {}
    apply(saved);

    btn.addEventListener('click', function () {
      var order = ['system', 'light', 'dark'];
      var cur = root.getAttribute('data-theme') || 'system';
      apply(order[(order.indexOf(cur) + 1) % order.length]);
    });
  })();

  // mobile menu
  (function () {
    var nav = document.getElementById('siteNav');
    var toggle = document.getElementById('menuToggle');
    if (!nav || !toggle) return;
    toggle.addEventListener('click', function () {
      var open = nav.classList.toggle('menu-open');
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      toggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
    });
    nav.querySelectorAll('.mobile-panel a').forEach(function (a) {
      a.addEventListener('click', function () {
        nav.classList.remove('menu-open');
        toggle.setAttribute('aria-expanded', 'false');
      });
    });
    window.addEventListener('resize', function () {
      if (window.innerWidth > 600) {
        nav.classList.remove('menu-open');
        toggle.setAttribute('aria-expanded', 'false');
      }
    });
  })();

  // auto-tag content pages (detections, actor profiles) for scroll-reveal, since their
  // markup is raw Markdown output and can't carry a .reveal class by hand. Pages that opt
  // into the richer .spring-reveal system (below) handle their own reveal instead.
  (function () {
    var content = document.querySelector('.page-content');
    if (!content) return;
    if (document.querySelector('.spring-reveal')) return;
    Array.prototype.forEach.call(content.children, function (el) {
      el.classList.add('reveal');
    });
  })();

  // scroll-reveal
  (function () {
    var items = document.querySelectorAll('.reveal');
    if (!items.length) return;
    if (!('IntersectionObserver' in window) || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      items.forEach(function (el) { el.classList.add('in-view'); });
      return;
    }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('in-view');
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });
    items.forEach(function (el) { io.observe(el); });
  })();

  // visitor counter: 612 was the running count when this was added, so the
  // displayed number is that offset plus real hits from here on. /hit only
  // fires once per browser session (sessionStorage-gated) so clicking around
  // multiple pages in one visit doesn't inflate the count; every other page
  // in the session just re-reads the current value with /get.
  (function () {
    var el = document.getElementById('visitorCounter');
    if (!el) return;
    var OFFSET = 611; // 612 - 1, since the first /hit response is 1
    var namespace = 'aaryan-aistrike-github-io';
    var key = 'site-visits';
    var alreadyHitThisSession = false;
    try { alreadyHitThisSession = sessionStorage.getItem('visitorHit') === '1'; } catch (e) {}
    var endpoint = 'https://abacus.jasoncameron.dev/' + (alreadyHitThisSession ? 'get' : 'hit') + '/' + namespace + '/' + key;

    fetch(endpoint).then(function (res) { return res.json(); }).then(function (data) {
      if (typeof data.value !== 'number') return;
      el.textContent = 'Visitors: ' + (OFFSET + data.value);
      try { sessionStorage.setItem('visitorHit', '1'); } catch (e) {}
    }).catch(function () {
      // leave the static fallback count in place if the counter service is unreachable
    });
  })();

  // spring-reveal: sections fly in from a random direction as they scroll into view,
  // driven by an actual damped mass-spring-damper simulation (see the beacon/card work
  // elsewhere on the site for the same technique)
  (function () {
    var items = document.querySelectorAll('.spring-reveal');
    if (!items.length) return;
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion || !('IntersectionObserver' in window)) {
      items.forEach(function (el) { el.style.opacity = '1'; el.style.transform = ''; });
      return;
    }

    function springTo(el, from, to, onDone) {
      var pos = { x: from.x, y: from.y, rot: from.rot, opacity: from.opacity };
      var vel = { x: 0, y: 0, rot: 0, opacity: 0 };
      // near-critical damping (critical for stiffness 130 is ~22.8) so it settles
      // crisply with just a light springy overshoot, not a long decaying oscillation
      var stiffness = 130, damping = 21, mass = 1, dt = 1 / 60;
      var keys = ['x', 'y', 'rot', 'opacity'];
      var startedAt = performance.now();
      var maxDurationMs = 1400; // hard safety net: force-finish rather than ever get stuck

      function finish() {
        el.style.transform = 'translate(0px,0px) rotate(0deg)';
        el.style.opacity = '1';
        if (onDone) onDone();
      }

      function step() {
        var settled = true;
        keys.forEach(function (k) {
          var delta = to[k] - pos[k];
          var accel = (stiffness * delta - damping * vel[k]) / mass;
          vel[k] += accel * dt;
          pos[k] += vel[k] * dt;
          // looser threshold: still visually imperceptible, converges far faster
          if (Math.abs(delta) > 0.4 || Math.abs(vel[k]) > 0.4) settled = false;
        });
        el.style.transform = 'translate(' + pos.x.toFixed(2) + 'px,' + pos.y.toFixed(2) + 'px) rotate(' + pos.rot.toFixed(2) + 'deg)';
        el.style.opacity = Math.max(0, Math.min(1, pos.opacity)).toFixed(3);

        if (settled || performance.now() - startedAt > maxDurationMs) finish();
        else requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        io.unobserve(entry.target);
        var el = entry.target;
        // scale the entrance distance down on narrow screens - the same 90-230px
        // throw that reads as a subtle swoop on desktop is a huge, chaotic-looking
        // fraction of a ~390px phone viewport otherwise
        var distanceScale = Math.min(1, window.innerWidth / 700);
        var angle = Math.random() * Math.PI * 2;
        var distance = (90 + Math.random() * 140) * distanceScale;
        var fromX = Math.cos(angle) * distance;
        var fromY = Math.sin(angle) * distance * 0.5;
        var fromRot = (Math.random() * 10) - 5;

        el.style.transition = 'none';
        el.style.opacity = '0';
        el.style.transform = 'translate(' + fromX + 'px,' + fromY + 'px) rotate(' + fromRot + 'deg)';

        requestAnimationFrame(function () {
          springTo(el, { x: fromX, y: fromY, rot: fromRot, opacity: 0 }, { x: 0, y: 0, rot: 0, opacity: 1 }, function () {
            el.style.transition = '';
            el.style.transform = '';
            // leave opacity explicitly at 1 (not '') - the base CSS rule is opacity:0,
            // clearing back to it here would make the text vanish right after revealing
            el.style.opacity = '1';
          });
        });
      });
    }, { threshold: 0.15, rootMargin: '0px 0px -60px 0px' });

    items.forEach(function (el) { io.observe(el); });
  })();
</script>
